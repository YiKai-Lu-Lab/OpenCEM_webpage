<nav class="navbar">
  <div class="nav-container">
    <a href="/" class="logo">
      <img src="/assets/images/logo.jpg" alt="OpenCEM Logo" class="nav-logo">
    </a>
    <ul class="nav-links">
      {% for item in site.data.navigation %}
        <li><a href="{{ item.link }}" class="nav-link {% if page.url == item.link %}active{% endif %}">
          {{ item.name }}
        </a></li>
      {% endfor %}
      <li><a href="#" class="nav-link" id="language-switch">
        {% if page.lang == 'zh' %}
          English
        {% else %}
          中文
        {% endif %}
      </a></li>
    </ul>
  </div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const languageSwitch = document.getElementById('language-switch');
    languageSwitch.addEventListener('click', function() {
      let currentPath = window.location.pathname;
      let newPath;

      // Determine the new path based on the current language
      if (currentPath.startsWith('/en/')) {
        newPath = currentPath.replace('/en/', '/zh/');
      } else if (currentPath.startsWith('/zh/')) {
        newPath = currentPath.replace('/zh/', '/en/');
      } else {
        // Default to English if no language prefix is found
        newPath = `/en${currentPath}`;
      }

      window.location.href = newPath;
    });
  });
</script>
